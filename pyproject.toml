[project]
name = "knowledge-context-studio"
version = "1.0.0.dev0"
description = "Internal knowledge and governed Agent context service"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.15,<2",
  "argon2-cffi>=25.1,<26",
  "pydantic-settings>=2.8,<3",
  "httpx>=0.28,<1",
  "cryptography>=44,<50",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/kcs"]

[tool.ruff]
line-length = 110

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
