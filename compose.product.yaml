name: kcs-product

x-app: &app
  image: ${KCS_PRODUCT_IMAGE:-kcs-product:local}
  init: true
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  read_only: true
  tmpfs: ["/tmp:size=128m,mode=1777"]
  volumes:
    - type: bind
      source: ${KCS_PRODUCT_RUNTIME}/.env
      target: /app/runtime/.env
      read_only: true
      bind: {create_host_path: false}
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  postgres:
    image: ${KCS_PRODUCT_POSTGRES_IMAGE:-postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685}
    env_file: ${KCS_PRODUCT_RUNTIME}/postgres.env
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kcs -d kcs"]
      interval: 3s
      timeout: 3s
      retries: 30
  engine:
    image: ${KCS_PRODUCT_ENGINE_IMAGE:-kcs-product-engine:20ec78a1}
    platform: linux/amd64
    init: true
    entrypoint: /app/.venv/bin/python
    command: ["-I", "-m", "openviking_cli.server_bootstrap", "--config", "/config/ov.conf"]
    working_dir: /data
    volumes:
      - engine_data:/data
      - type: bind
        source: ${KCS_PRODUCT_RUNTIME}/engine.json
        target: /config/ov.conf
        read_only: true
        bind: {create_host_path: false}
    restart: unless-stopped
    stop_grace_period: 90s
    cpus: 2
    mem_limit: 4g
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  api:
    <<: *app
    ports: ["${KCS_PRODUCT_BIND:-127.0.0.1}:${KCS_PRODUCT_PORT:-18088}:8088"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/health/ready',timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 20
  worker:
    <<: *app
    command: ["python", "-m", "kcs.worker"]
    stop_grace_period: 90s
  tools:
    image: ${KCS_PRODUCT_IMAGE:-kcs-product:local}
    profiles: [tools]
    user: "0:0"
    volumes:
      - ${KCS_PRODUCT_RUNTIME}:/app/runtime
    command: ["python", "scripts/check-engine.py"]

volumes:
  postgres_data:
  engine_data:
